<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="285" height="187" font-family="Cambria, Georgia, 'Times New Roman', serif">
  <title>点积 = 投影长度（动画）</title>
  <desc>向量 y 在来回扫动夹角 θ，投影垂线与 θ 弧实时跟随，演示投影随夹角变化。</desc>
  <style>
    .axis{color:#cbd5e1}.x{color:#2563eb}.y{color:#ea580c}.gray{color:#9ca3af}.arc{color:#6b7280}.ink{color:#1f2937}.lbl{color:#374151}.dim{color:#6b7280}
    @media (prefers-color-scheme: dark){
      .axis{color:#475569}.x{color:#60a5fa}.y{color:#fb923c}.gray{color:#64748b}.arc{color:#94a3b8}.ink{color:#e5e7eb}.lbl{color:#e5e7eb}.dim{color:#9ca3af}
    }
  </style>
  <defs>
    <marker id="ahXa" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path class="x" d="M0,0 L8,3 L0,6 Z" fill="currentColor"/></marker>
    <marker id="ahYa" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path class="y" d="M0,0 L8,3 L0,6 Z" fill="currentColor"/></marker>
  </defs>
  <line class="axis" x1="20" y1="205" x2="360" y2="205" stroke="currentColor" stroke-width="1"/>
  <line class="x" x1="40" y1="205" x2="335" y2="205" stroke="currentColor" stroke-width="2.6" marker-end="url(#ahXa)"/>
  <text class="x" x="342" y="200" font-size="16" font-style="italic" fill="currentColor">x</text>
  <line class="gray" x1="206.44" y1="205" x2="206.44" y2="150.93" stroke="currentColor" stroke-width="1.6" stroke-dasharray="6 4">
    <animate attributeName="x1" values="206.44;163.74;94.07;163.74;206.44" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="206.44;163.74;94.07;163.74;206.44" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="150.93;81.26;38.56;81.26;150.93" dur="6s" repeatCount="indefinite"/>
  </line>
  <line class="y" x1="40" y1="205" x2="206.44" y2="150.93" stroke="currentColor" stroke-width="2.6" marker-end="url(#ahYa)">
    <animate attributeName="x2" values="206.44;163.74;94.07;163.74;206.44" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="150.93;81.26;38.56;81.26;150.93" dur="6s" repeatCount="indefinite"/>
  </line>
  <text class="y" x="212" y="146" font-size="16" font-style="italic" fill="currentColor">y</text>
  <path class="arc" d="M86,205 A46,46 0 0,0 83.75,190.79" fill="none" stroke="currentColor" stroke-width="1.3">
    <animate attributeName="d"
      values="M86,205 A46,46 0 0,0 83.75,190.79;M86,205 A46,46 0 0,0 72.53,172.47;M86,205 A46,46 0 0,0 54.21,161.25;M86,205 A46,46 0 0,0 72.53,172.47;M86,205 A46,46 0 0,0 83.75,190.79"
      dur="6s" repeatCount="indefinite"/>
  </path>
  <text class="lbl" x="84" y="196" font-size="14" font-style="italic" fill="currentColor">θ
    <animate attributeName="x" values="84;76;62;76;84" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="196;188;180;188;196" dur="6s" repeatCount="indefinite"/>
  </text>
  <circle class="ink" cx="40" cy="205" r="2.8" fill="currentColor"/>
  <text class="dim" x="26" y="222" font-size="12" fill="currentColor">O</text>
  <text class="dim" x="40" y="240" font-size="12.5" font-style="italic" fill="currentColor">proj = ‖y‖·cosθ</text>
</svg>
