<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" font-family="Cambria, Georgia, 'Times New Roman', serif">
  <title>余弦相似度几何意义（动画）</title>
  <desc>向量 y 绕原点旋转，夹角 θ 从 0° 到 180° 再返回，实时显示 cos θ 值变化。</desc>
  <style>
    .axis{color:#cbd5e1}.x{color:#2563eb}.y{color:#ea580c}.gray{color:#9ca3af}.arc{color:#6b7280}.ink{color:#1f2937}.lbl{color:#374151}.dim{color:#6b7280}.result{color:#7c3aed}
    @media (prefers-color-scheme: dark){
      .axis{color:#475569}.x{color:#60a5fa}.y{color:#fb923c}.gray{color:#64748b}.arc{color:#94a3b8}.ink{color:#e5e7eb}.lbl{color:#e5e7eb}.dim{color:#9ca3af}.result{color:#a78bfa}
    }
  </style>
  <defs>
    <marker id="ahXa" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path class="x" d="M0,0 L8,3 L0,6 Z" fill="currentColor"/></marker>
    <marker id="ahYa" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path class="y" d="M0,0 L8,3 L0,6 Z" fill="currentColor"/></marker>
  </defs>
  
  <line class="axis" x1="20" y1="200" x2="380" y2="200" stroke="currentColor" stroke-width="1"/>
  <line class="x" x1="40" y1="200" x2="320" y2="200" stroke="currentColor" stroke-width="2.6" marker-end="url(#ahXa)"/>
  <text class="x" x="330" y="195" font-size="16" font-style="italic" fill="currentColor">x</text>
  
  <line class="gray" x1="218" y1="200" x2="218" y2="80" stroke="currentColor" stroke-width="1.6" stroke-dasharray="6 4">
    <animate attributeName="x1" values="218;150;40;150;218" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="218;150;40;150;218" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="80;70;200;70;80" dur="8s" repeatCount="indefinite"/>
  </line>
  
  <line class="y" x1="40" y1="200" x2="218" y2="80" stroke="currentColor" stroke-width="2.6" marker-end="url(#ahYa)">
    <animate attributeName="x2" values="218;150;40;150;218" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="80;70;200;70;80" dur="8s" repeatCount="indefinite"/>
  </line>
  <text class="y" x="225" y="75" font-size="16" font-style="italic" fill="currentColor">y</text>
  
  <path class="arc" d="M86,200 A46,46 0 0,0 83.75,185.79" fill="none" stroke="currentColor" stroke-width="1.3">
    <animate attributeName="d"
      values="M86,200 A46,46 0 0,0 83.75,185.79;M86,200 A46,46 0 0,0 72.53,167.47;M86,200 A46,46 0 0,1 132,200;M86,200 A46,46 0 0,0 72.53,167.47;M86,200 A46,46 0 0,0 83.75,185.79"
      dur="8s" repeatCount="indefinite"/>
  </path>
  <text class="lbl" x="84" y="190" font-size="14" font-style="italic" fill="currentColor">θ
    <animate attributeName="x" values="84;76;100;76;84" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="190;182;195;182;190" dur="8s" repeatCount="indefinite"/>
  </text>
  
  <circle class="ink" cx="40" cy="200" r="2.8" fill="currentColor"/>
  <text class="dim" x="26" y="220" font-size="12" fill="currentColor">O</text>
  
  <g id="result-display">
    <rect x="280" y="40" width="130" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" class="dim" opacity="0.8"/>
    <text class="lbl" x="295" y="60" font-size="13" fill="currentColor" font-weight="600">cos θ =</text>
    <text class="result" x="295" y="85" font-size="22" font-weight="bold" fill="currentColor">1.00
      <animate attributeName="opacity" values="1;0.7;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <g id="interpretation-labels">
    <text x="80" y="240" font-size="11" fill="currentColor" opacity="0">
      <tspan class="dim">θ ≈ 0°</tspan>
      <tspan class="result"> → 方向相同</tspan>
      <animate attributeName="opacity" values="0.3;0.3;0;0;0;0;0;0.3;0.3" dur="8s" repeatCount="indefinite"/>
    </text>
    
    <text x="80" y="255" font-size="11" fill="currentColor" opacity="0">
      <tspan class="dim">θ ≈ 90°</tspan>
      <tspan class="result"> → 正交</tspan>
      <animate attributeName="opacity" values="0;0;0.3;0.3;0;0;0;0;0" dur="8s" repeatCount="indefinite"/>
    </text>
    
    <text x="80" y="270" font-size="11" fill="currentColor" opacity="0">
      <tspan class="dim">θ ≈ 180°</tspan>
      <tspan class="result"> → 方向相反</tspan>
      <animate attributeName="opacity" values="0;0;0;0;0.3;0.3;0;0;0" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <text class="dim" x="210" y="260" font-size="12" fill="currentColor" text-anchor="middle" font-style="italic">
    余弦相似度 ∈ [-1, 1]
  </text>
</svg>