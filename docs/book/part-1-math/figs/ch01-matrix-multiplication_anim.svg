<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 350" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>矩阵乘法计算过程动画</title>
  <desc>逐步展示矩阵乘法 A(2×3) × B(3×2) = C(2×2) 的行列点积计算过程</desc>
  <style>
    .axis { color: #cbd5e1; }
    .a { color: #2563eb; font-weight: 600; }
    .b { color: #ea580c; font-weight: 600; }
    .calc { color: #059669; } 
    .gray { color: #9ca3af; }
    .ink { color: #1f2937; }
    .lbl { color: #374151; }
    .dim { color: #6b7280; } 
    .bracket { color: #64748b; }
    .result { color: #7c3aed; }
    .op { color: #6b7280; }
    .matrix-label { color: #6b7280; font-style: italic; }
    
    /* 高亮框基础样式 */
    .hl-a { fill: #2563eb; stroke: #2563eb; fill-opacity: 0.15; stroke-width: 2; stroke-dasharray: 4; rx: 4; }
    .hl-b { fill: #ea580c; stroke: #ea580c; fill-opacity: 0.15; stroke-width: 2; stroke-dasharray: 4; rx: 4; }
    .hl-c { fill: #7c3aed; stroke: #7c3aed; fill-opacity: 0.25; stroke-width: 2; rx: 4; }
    
    /* 箭头样式 */
    .arrow-line { stroke-width: 2; fill: none; stroke-dasharray: 5 3; }
    .arrow-a { stroke: #2563eb; }
    .arrow-b { stroke: #ea580c; }
    .arrow-head-a { fill: #2563eb; stroke: none; }
    .arrow-head-b { fill: #ea580c; stroke: none; }

    @media (prefers-color-scheme: dark) {
      .axis { color: #475569; }
      .a { color: #60a5fa; }
      .b { color: #fb923c; }
      .calc { color: #34d399; } 
      .gray { color: #64748b; }
      .ink { color: #e5e7eb; }
      .lbl { color: #e5e7eb; }
      .dim { color: #9ca3af; } 
      .bracket { color: #94a3b8; }
      .result { color: #a78bfa; }
      .op { color: #9ca3af; }
      .matrix-label { color: #9ca3af; }
      /* 暗黑模式高亮框适配 */
      .hl-a { fill: #60a5fa; stroke: #60a5fa; fill-opacity: 0.2; }
      .hl-b { fill: #fb923c; stroke: #fb923c; fill-opacity: 0.2; }
      .hl-c { fill: #a78bfa; stroke: #a78bfa; fill-opacity: 0.3; }
      .arrow-a { stroke: #60a5fa; }
      .arrow-b { stroke: #fb923c; }
      .arrow-head-a { fill: #60a5fa; }
      .arrow-head-b { fill: #fb923c; }
    }
  </style>
  
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="currentColor" stroke-width="0.3" class="gray" opacity="0.3"/>
    </pattern>
    <!-- 箭头标记 -->
    <marker id="arrowhead-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-head-a"/>
    </marker>
    <marker id="arrowhead-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-head-b"/>
    </marker>
  </defs>
  
  <!-- 背景与网格 -->
  <rect width="100%" height="100%" fill="url(#grid)" class="gray"/>
  
  <!-- 辅助分割线 -->
  <line class="gray" x1="240" y1="30" x2="240" y2="185" stroke="currentColor" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4"/>
  <line class="gray" x1="440" y1="30" x2="440" y2="185" stroke="currentColor" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4"/>
  
  <!-- 顶部标题 -->
  <text class="lbl" x="120" y="35" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">矩阵 A (2×3)</text>
  <text class="lbl" x="340" y="35" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">矩阵 B (3×2)</text>
  <text class="lbl" x="555" y="35" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">结果 C (2×2)</text>
  
  <!-- ================= 动态高亮遮罩层 (核心动画逻辑) ================= -->
  <g id="highlights">
    <!-- A矩阵行高亮: 在行1(y=85)和行2(y=125)之间切换 -->
    <rect class="hl-a" x="55" y="85" width="130" height="26">
      <animate attributeName="y" values="85; 85; 125; 125; 85" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="8s" calcMode="discrete" repeatCount="indefinite" />
    </rect>
    
    <!-- B矩阵列高亮: 在列1(x=295)和列2(x=355)之间切换 -->
    <rect class="hl-b" x="295" y="85" width="30" height="88">
      <animate attributeName="x" values="295; 355; 295; 355; 295" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="8s" calcMode="discrete" repeatCount="indefinite" />
    </rect>
    
    <!-- C矩阵结果单元格高亮: 配合A和B的行列进行2x2的网格移动 -->
    <rect class="hl-c" x="510" y="95" width="40" height="26">
      <animate attributeName="x" values="510; 560; 510; 560; 510" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="8s" calcMode="discrete" repeatCount="indefinite" />
      <animate attributeName="y" values="95; 95; 125; 125; 95" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="8s" calcMode="discrete" repeatCount="indefinite" />
    </rect>
  </g>
  
  <!-- ================= 动态箭头连接 ================= -->
  <g id="arrows">
    <!-- A行到C的箭头 -->
    <path class="arrow-line arrow-a" d="M 190 98 Q 350 80 505 108" marker-end="url(#arrowhead-a)" opacity="0">
      <animate attributeName="opacity" values="0.7; 0.7; 0; 0; 0.7" keyTimes="0; 0.24; 0.25; 0.75; 1" dur="8s" calcMode="discrete" repeatCount="indefinite" />
      <animate attributeName="d" values="M 190 98 Q 350 80 505 108; M 190 98 Q 350 80 505 108; M 190 138 Q 350 80 505 138; M 190 138 Q 350 80 505 138; M 190 98 Q 350 80 505 108" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="8s" calcMode="discrete" repeatCount="indefinite" />
    </path>
    
    <!-- B列到C的箭头 -->
    <path class="arrow-line arrow-b" d="M 400 105 Q 450 100 505 108" marker-end="url(#arrowhead-b)" opacity="0">
      <animate attributeName="opacity" values="0.7; 0.7; 0; 0; 0.7" keyTimes="0; 0.24; 0.25; 0.75; 1" dur="8s" calcMode="discrete" repeatCount="indefinite" />
      <animate attributeName="d" values="M 400 105 Q 450 100 505 108; M 400 105 Q 450 100 505 108; M 400 105 Q 450 100 505 138; M 400 105 Q 450 100 505 138; M 400 105 Q 450 100 505 108" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="8s" calcMode="discrete" repeatCount="indefinite" />
    </path>
  </g>

  <!-- ================= 矩阵 A = [1 2 3; 4 5 6] ================= -->
  <g id="matrix-A">
    <path d="M 45 70 L 35 70 L 35 175 L 45 175" fill="none" stroke="currentColor" stroke-width="2" class="bracket"/>
    <path d="M 195 70 L 205 70 L 205 175 L 195 175" fill="none" stroke="currentColor" stroke-width="2" class="bracket"/>
    
    <text class="ink" x="70" y="105" font-size="18" fill="currentColor" text-anchor="middle" font-weight="500">1</text>
    <text class="ink" x="120" y="105" font-size="18" fill="currentColor" text-anchor="middle" font-weight="500">2</text>
    <text class="ink" x="170" y="105" font-size="18" fill="currentColor" text-anchor="middle" font-weight="500">3</text>
    
    <text class="ink" x="70" y="145" font-size="18" fill="currentColor" text-anchor="middle" font-weight="500">4</text>
    <text class="ink" x="120" y="145" font-size="18" fill="currentColor" text-anchor="middle" font-weight="500">5</text>
    <text class="ink" x="170" y="145" font-size="18" fill="currentColor" text-anchor="middle" font-weight="500">6</text>
    
    <text class="matrix-label a" x="120" y="195" font-size="14" fill="currentColor" text-anchor="middle">A</text>
  </g>
  
  <!-- ================= 矩阵 B = [7 8; 9 10; 11 12] ================= -->
  <g id="matrix-B">
    <path d="M 275 70 L 265 70 L 265 175 L 275 175" fill="none" stroke="currentColor" stroke-width="2" class="bracket"/>
    <path d="M 405 70 L 415 70 L 415 175 L 405 175" fill="none" stroke="currentColor" stroke-width="2" class="bracket"/>
    
    <text class="ink" x="310" y="105" font-size="18" fill="currentColor" text-anchor="middle" font-weight="500">7</text>
    <text class="ink" x="370" y="105" font-size="18" fill="currentColor" text-anchor="middle" font-weight="500">8</text>
    
    <text class="ink" x="310" y="135" font-size="18" fill="currentColor" text-anchor="middle" font-weight="500">9</text>
    <text class="ink" x="370" y="135" font-size="18" fill="currentColor" text-anchor="middle" font-weight="500">10</text>
    
    <text class="ink" x="310" y="165" font-size="18" fill="currentColor" text-anchor="middle" font-weight="500">11</text>
    <text class="ink" x="370" y="165" font-size="18" fill="currentColor" text-anchor="middle" font-weight="500">12</text>
    
    <text class="matrix-label b" x="340" y="195" font-size="14" fill="currentColor" text-anchor="middle">B</text>
  </g>
  
  <!-- ================= 结果矩阵 C ================= -->
  <g id="matrix-C">
    <path d="M 495 80 L 485 80 L 485 165 L 495 165" fill="none" stroke="currentColor" stroke-width="2" class="bracket"/>
    <path d="M 615 80 L 625 80 L 625 165 L 615 165" fill="none" stroke="currentColor" stroke-width="2" class="bracket"/>
    
    <text class="ink" x="530" y="115" font-size="18" fill="currentColor" text-anchor="middle" font-weight="500">58</text>
    <text class="ink" x="580" y="115" font-size="18" fill="currentColor" text-anchor="middle" font-weight="500">64</text>
    <text class="ink" x="530" y="145" font-size="18" fill="currentColor" text-anchor="middle" font-weight="500">139</text>
    <text class="ink" x="580" y="145" font-size="18" fill="currentColor" text-anchor="middle" font-weight="500">154</text>
    
    <text class="matrix-label result" x="555" y="195" font-size="14" fill="currentColor" text-anchor="middle">C = A×B</text>
  </g>

  <!-- 中间连接提示文本 -->
  <text class="dim" x="375" y="215" font-size="13" fill="currentColor" text-anchor="middle" font-style="italic">
    计算过程：C的对应元素 = A的对应行 向量点积 B的对应列
  </text>
  <line class="gray" x1="150" y1="225" x2="600" y2="225" stroke="currentColor" stroke-width="0.5" opacity="0.4"/>
  
  <!-- ================= 计算过程详情 (带焦点动画) ================= -->
  <g id="calculation" transform="translate(375, 250)" text-anchor="middle" font-size="16" font-family="'Courier New', Courier, monospace">
    
    <!-- C11 计算 -->
    <text y="0" fill="currentColor">
      <animate attributeName="opacity" values="1; 0.25; 0.25; 0.25; 1" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="8s" calcMode="discrete" repeatCount="indefinite" />
      <tspan class="a">1</tspan><tspan class="op"> × </tspan><tspan class="b">7</tspan><tspan class="op"> + </tspan><tspan class="a">2</tspan><tspan class="op"> × </tspan><tspan class="b">9</tspan><tspan class="op"> + </tspan><tspan class="a">3</tspan><tspan class="op"> × </tspan><tspan class="b">11</tspan><tspan class="op"> = </tspan><tspan class="result" font-weight="bold">58</tspan>
    </text>
    
    <!-- C12 计算 -->
    <text y="24" fill="currentColor">
      <animate attributeName="opacity" values="0.25; 1; 0.25; 0.25; 0.25" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="8s" calcMode="discrete" repeatCount="indefinite" />
      <tspan class="a">1</tspan><tspan class="op"> × </tspan><tspan class="b">8</tspan><tspan class="op"> + </tspan><tspan class="a">2</tspan><tspan class="op"> × </tspan><tspan class="b">10</tspan><tspan class="op"> + </tspan><tspan class="a">3</tspan><tspan class="op"> × </tspan><tspan class="b">12</tspan><tspan class="op"> = </tspan><tspan class="result" font-weight="bold">64</tspan>
    </text>
    
    <!-- C21 计算 -->
    <text y="48" fill="currentColor">
      <animate attributeName="opacity" values="0.25; 0.25; 1; 0.25; 0.25" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="8s" calcMode="discrete" repeatCount="indefinite" />
      <tspan class="a">4</tspan><tspan class="op"> × </tspan><tspan class="b">7</tspan><tspan class="op"> + </tspan><tspan class="a">5</tspan><tspan class="op"> × </tspan><tspan class="b">9</tspan><tspan class="op"> + </tspan><tspan class="a">6</tspan><tspan class="op"> × </tspan><tspan class="b">11</tspan><tspan class="op"> = </tspan><tspan class="result" font-weight="bold">139</tspan>
    </text>
    
    <!-- C22 计算 -->
    <text y="72" fill="currentColor">
      <animate attributeName="opacity" values="0.25; 0.25; 0.25; 1; 0.25" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="8s" calcMode="discrete" repeatCount="indefinite" />
      <tspan class="a">4</tspan><tspan class="op"> × </tspan><tspan class="b">8</tspan><tspan class="op"> + </tspan><tspan class="a">5</tspan><tspan class="op"> × </tspan><tspan class="b">10</tspan><tspan class="op"> + </tspan><tspan class="a">6</tspan><tspan class="op"> × </tspan><tspan class="b">12</tspan><tspan class="op"> = </tspan><tspan class="result" font-weight="bold">154</tspan>
    </text>
    
  </g>
  
  <!-- 底部说明 -->
  <text class="dim" x="375" y="340" font-size="12" fill="currentColor" text-anchor="middle">
    行×列做点积：每个结果元素是A的一行与B的一列的内积
  </text>
</svg>
