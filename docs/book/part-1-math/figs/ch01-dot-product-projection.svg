<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="380" height="250" font-family="Cambria, Georgia, 'Times New Roman', serif">
  <title>点积 = 投影长度</title>
  <desc>向量 x 与 y，夹角 θ，y 在 x 方向上的投影 ‖y‖·cosθ。</desc>
  <style>
    .axis{color:#cbd5e1}.x{color:#2563eb}.y{color:#ea580c}.gray{color:#9ca3af}.arc{color:#6b7280}.ink{color:#1f2937}.lbl{color:#374151}.dim{color:#6b7280}
    @media (prefers-color-scheme: dark){
      .axis{color:#475569}.x{color:#60a5fa}.y{color:#fb923c}.gray{color:#64748b}.arc{color:#94a3b8}.ink{color:#e5e7eb}.lbl{color:#e5e7eb}.dim{color:#9ca3af}
    }
  </style>
  <defs>
    <marker id="ahX" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path class="x" d="M0,0 L8,3 L0,6 Z" fill="currentColor"/></marker>
    <marker id="ahY" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path class="y" d="M0,0 L8,3 L0,6 Z" fill="currentColor"/></marker>
  </defs>
  <line class="axis" x1="20" y1="205" x2="360" y2="205" stroke="currentColor" stroke-width="1"/>
  <line class="x" x1="40" y1="205" x2="335" y2="205" stroke="currentColor" stroke-width="2.6" marker-end="url(#ahX)"/>
  <text class="x" x="342" y="200" font-size="16" font-style="italic" fill="currentColor">x</text>
  <line class="y" x1="40" y1="205" x2="183.4" y2="104.7" stroke="currentColor" stroke-width="2.6" marker-end="url(#ahY)"/>
  <text class="y" x="189" y="100" font-size="16" font-style="italic" fill="currentColor">y</text>
  <line class="gray" x1="183.4" y1="205" x2="183.4" y2="104.7" stroke="currentColor" stroke-width="1.6" stroke-dasharray="6 4"/>
  <path class="gray" d="M176.4,205 L176.4,197 L183.4,197" fill="none" stroke="currentColor" stroke-width="1"/>
  <path class="arc" d="M86,205 A46,46 0 0,0 77.7,178.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text class="lbl" x="88" y="196" font-size="14" font-style="italic" fill="currentColor">θ</text>
  <text class="dim" x="150" y="222" font-size="12.5" font-style="italic" fill="currentColor">proj = ‖y‖·cosθ</text>
  <circle class="ink" cx="40" cy="205" r="2.8" fill="currentColor"/>
  <text class="dim" x="26" y="222" font-size="12" fill="currentColor">O</text>
</svg>
