<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="380" height="250" font-family="Cambria, Georgia, 'Times New Roman', serif">
  <title>矩阵乘法 = 旋转 + 缩放（动画）</title>
  <desc>橙色向量在 x 与 A·x 之间连续形变，演示矩阵把 x 旋转 α 又拉伸。</desc>
  <style>
    .axis{color:#e5e7eb}.x{color:#2563eb}.y{color:#ea580c}.ink{color:#1f2937}.lbl{color:#374151}.dim{color:#6b7280}
    @media (prefers-color-scheme: dark){
      .axis{color:#334155}.x{color:#60a5fa}.y{color:#fb923c}.ink{color:#e5e7eb}.lbl{color:#e5e7eb}.dim{color:#9ca3af}
    }
  </style>
  <defs>
    <marker id="aX2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path class="x" d="M0,0 L8,3 L0,6 Z" fill="currentColor"/></marker>
    <marker id="aY2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path class="y" d="M0,0 L8,3 L0,6 Z" fill="currentColor"/></marker>
  </defs>
  <line class="axis" x1="30" y1="210" x2="360" y2="210" stroke="currentColor" stroke-width="1"/>
  <line class="axis" x1="60" y1="30" x2="60" y2="235" stroke="currentColor" stroke-width="1"/>
  <line class="x" x1="60" y1="210" x2="163.4" y2="172.4" stroke="currentColor" stroke-width="2" stroke-opacity="0.35" marker-end="url(#aX2)"/>
  <text class="x" x="168" y="170" font-size="16" font-style="italic" fill="currentColor" fill-opacity="0.5">x</text>
  <line class="y" x1="60" y1="210" x2="163.4" y2="172.4" stroke="currentColor" stroke-width="2.8" marker-end="url(#aY2)">
    <animate attributeName="x2" values="163.4;148;163.4" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="172.4;57.6;172.4" dur="4s" repeatCount="indefinite"/>
  </line>
  <text class="y" x="153" y="54" font-size="16" font-style="italic" fill="currentColor">A·x</text>
  <circle class="ink" cx="60" cy="210" r="2.8" fill="currentColor"/>
  <text class="dim" x="44" y="227" font-size="12" fill="currentColor">O</text>
  <text class="dim" x="100" y="240" font-size="12.5" font-style="italic" fill="currentColor">矩阵把 x 旋转 α 又拉伸</text>
</svg>
