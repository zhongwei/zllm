<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" font-family="Cambria, Georgia, 'Times New Roman', serif">
  <title>向量三角形与余弦定理</title>
  <desc>向量 x 与 y 共起点 O，终点连线为 x−y，三条边 ‖x‖、‖y‖、‖x−y‖ 围成三角形，夹角 θ 在 O 处。</desc>
  <style>
    .x{color:#2563eb}.y{color:#ea580c}.gray{color:#9ca3af}.arc{color:#6b7280}.ink{color:#1f2937}.lbl{color:#374151}.dim{color:#6b7280}
    @media (prefers-color-scheme: dark){
      .x{color:#60a5fa}.y{color:#fb923c}.gray{color:#64748b}.arc{color:#94a3b8}.ink{color:#e5e7eb}.lbl{color:#e5e7eb}.dim{color:#9ca3af}
    }
  </style>
  <defs>
    <marker id="ahXt" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path class="x" d="M0,0 L8,3 L0,6 Z" fill="currentColor"/></marker>
    <marker id="ahYt" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path class="y" d="M0,0 L8,3 L0,6 Z" fill="currentColor"/></marker>
  </defs>

  <!-- 第三边：tip_x → tip_y，虚线，代表 x−y -->
  <line class="gray" x1="300" y1="210" x2="165" y2="65" stroke="currentColor" stroke-width="1.8" stroke-dasharray="6 4"/>

  <!-- 向量 x：O → (300,210) -->
  <line class="x" x1="60" y1="210" x2="300" y2="210" stroke="currentColor" stroke-width="2.6" marker-end="url(#ahXt)"/>
  <text class="x" x="308" y="206" font-size="16" font-style="italic" fill="currentColor">x</text>

  <!-- 向量 y：O → (165,65) -->
  <line class="y" x1="60" y1="210" x2="165" y2="65" stroke="currentColor" stroke-width="2.6" marker-end="url(#ahYt)"/>
  <text class="y" x="150" y="58" font-size="16" font-style="italic" fill="currentColor">y</text>

  <!-- 第三边标签 x−y -->
  <text class="gray" x="244" y="132" font-size="15" fill="currentColor">x − y</text>

  <!-- 夹角弧 θ -->
  <path class="arc" d="M98,210 A38,38 0 0,0 82.26,179.21" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text class="lbl" x="86" y="201" font-size="14" font-style="italic" fill="currentColor">θ</text>

  <!-- 原点 -->
  <circle class="ink" cx="60" cy="210" r="2.8" fill="currentColor"/>
  <text class="dim" x="48" y="226" font-size="12" fill="currentColor">O</text>
</svg>
